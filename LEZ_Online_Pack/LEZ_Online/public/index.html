<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090611"><title>LEZ: SURVIVAL</title>
<style>
:root{--bg:#090611;--panel:#171023;--purple:#a855f7;--pink:#e879f9;--muted:#cbb7e5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh;background:#0b0814}
button,input{font:inherit}button{border:1px solid #b46aff88;border-radius:13px;padding:13px 15px;width:100%;margin:5px 0;color:white;font-weight:850;background:linear-gradient(90deg,#7026b9,#ad42eb);box-shadow:0 5px 18px #8b35ff30;cursor:pointer}
button.alt{background:#21172e;border:1px solid #75449d}button:disabled{opacity:.4}
#overlay{position:fixed;inset:0;z-index:5;overflow:auto;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#090611f5,#160b27f5)}
.panel{width:min(470px,100%);max-height:94vh;overflow:auto;text-align:center;border:1px solid #a855f7;border-radius:23px;padding:22px 19px;background:linear-gradient(145deg,#1a1028,#0d0a16);box-shadow:0 0 45px #8b35ff33}
.logo{font-size:clamp(48px,14vw,72px);font-weight:1000;letter-spacing:5px;line-height:1;color:#e3c2ff;text-shadow:0 0 12px #a855f7,0 0 34px #8b35ff}
.sub{color:var(--muted);margin:8px 0 18px;font-size:11px;letter-spacing:2px}.muted{color:var(--muted);font-size:13px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:#21172e;border:1px solid #75449d;border-radius:13px;padding:12px;text-align:left}.tile b{display:block;margin-bottom:4px}.tile small{color:#cbb7e5}.section{font-size:12px;letter-spacing:1.5px;color:#d8b4fe;text-align:left;margin:16px 0 7px}
#hud{position:fixed;z-index:2;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-weight:800;text-shadow:0 2px 8px #000}
.pill{background:#171023dd;border:1px solid #9b4dff88;border-radius:11px;padding:7px 9px;font-size:12px}
#controls{position:fixed;z-index:3;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#stick{width:116px;height:116px;border-radius:50%;background:#a855f722;border:2px solid #c084fc88;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:48px;height:48px;border-radius:50%;left:32px;top:32px;background:#c084fcaa;border:2px solid #ead5ff;box-shadow:0 0 18px #a855f7}
.actions{display:flex;gap:10px;align-items:end;pointer-events:auto}.action{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:#8b35ff66;border:2px solid #d8b4fe;font-size:24px;touch-action:none}.action.fire{width:80px;height:80px;background:#c026d366;border-color:#f0abfc}
#pause{position:fixed;z-index:4;right:12px;top:57px;width:auto;padding:8px 12px;background:#21172ecc}
.hidden{display:none!important}.row{display:flex;gap:8px}.row button{flex:1}.coin{color:#facc15;font-weight:900}
input{width:100%;padding:12px;border-radius:10px;background:#0d0a16;color:white;border:1px solid #75449d;margin:6px 0}
@media(min-width:800px){#controls{opacity:.65}}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud" class="hidden"><div class="pill" id="health">❤️ 100</div><div class="pill" id="wave">OLEADA 1</div><div class="pill" id="score">⭐ 0</div><div class="pill" id="coins">🪙 0</div></div>
<button id="pause" class="hidden">Ⅱ PAUSA</button>
<div id="controls" class="hidden"><div id="stick"><div id="knob"></div></div><div class="actions"><div class="action" id="dash">⚡</div><div class="action fire" id="fire">🔥</div></div></div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1,active=false,paused=false,mode=1,last=0,spawn=0,score=0,wave=1,shake=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const defaults={name:'Jugador LEZ',coins:100,high:0,kills:0,owned:['violet'],skin:'violet',weapon:'basic',sound:true,missions:{kills:0,waves:0}};
let data;try{data={...defaults,...JSON.parse(localStorage.getItem('lez_save')||'{}')}}catch{data={...defaults}}
function save(){localStorage.setItem('lez_save',JSON.stringify(data))}
const skins=[{id:'violet',name:'Neón violeta',price:0,color:'#c084fc'},{id:'cyan',name:'Ciber azul',price:120,color:'#5eead4'},{id:'gold',name:'Leyenda dorada',price:300,color:'#facc15'},{id:'red',name:'Furia roja',price:220,color:'#fb7185'}];
const weapons=[{id:'basic',name:'Bláster básico',price:0,damage:1,rate:.25},{id:'rapid',name:'Ráfaga rápida',price:180,damage:1,rate:.13},{id:'power',name:'Cañón de plasma',price:350,damage:2,rate:.34}];
let players=[],enemies=[],bullets=[],particles=[],keys={},joy={x:0,y:0,on:false},firing=false;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function menu(){active=false;paused=false;$('controls').classList.add('hidden');$('hud').classList.add('hidden');$('pause').classList.add('hidden');$('overlay').classList.remove('hidden');renderHome()}
function panel(content){$('panel').innerHTML=content}
function head(sub){return `<div class="logo">LEZ</div><div class="sub">${sub}</div>`}
function renderHome(){panel(`${head('SURVIVAL • SOBREVIVE SI PUEDES')}<div class="tile" style="text-align:center;margin-bottom:10px"><b>${esc(data.name)}</b><small>Récord: ${data.high} puntos · Eliminaciones: ${data.kills}</small><div class="coin">🪙 ${data.coins} monedas</div></div><button id="solo">⚔️ JUGAR SOLO</button><button class="alt" id="coop">👥 COOPERATIVO LOCAL (2 JUGADORES)</button><div class="grid"><button class="alt" id="shop">🛒 TIENDA</button><button class="alt" id="inventory">🎒 INVENTARIO</button><button class="alt" id="missions">🎯 MISIONES</button><button class="alt" id="profile">👤 PERFIL</button><button class="alt" id="settings">⚙️ AJUSTES</button><button class="alt" id="online">🌐 MULTIJUGADOR ONLINE</button></div><div class="small muted">Versión de prueba: progreso guardado en este dispositivo.</div>`);
$('solo').onclick=()=>start(1);$('coop').onclick=()=>start(2);$('shop').onclick=shop;$('inventory').onclick=inventory;$('missions').onclick=missions;$('profile').onclick=profile;$('settings').onclick=settings;$('online').onclick=onlineInfo}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function back(){renderHome()}
function shop(){let s=skins.map(x=>`<div class="tile"><b>${x.name}</b><small>Aspecto de personaje</small><p class="coin">${x.price?`🪙 ${x.price}`:'GRATIS'}</p><button data-skin="${x.id}">${data.owned.includes(x.id)?(data.skin===x.id?'EQUIPADO':'Equipar'):'Comprar'}</button></div>`).join('');let w=weapons.map(x=>`<div class="tile"><b>${x.name}</b><small>${x.damage} daño · disparo ${x.rate}s</small><p class="coin">${x.price?`🪙 ${x.price}`:'GRATIS'}</p><button data-weapon="${x.id}">${data.weapon===x.id?'EQUIPADA':(x.price?'Comprar / equipar':'Equipar')}</button></div>`).join('');panel(`${head('TIENDA')}<div class="coin">🪙 ${data.coins}</div><div class="section">PERSONAJES</div><div class="grid">${s}</div><div class="section">ARMAS</div><div class="grid">${w}</div><button class="alt" id="back">VOLVER</button>`);$('back').onclick=back;
document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{let x=skins.find(a=>a.id===b.dataset.skin);if(data.owned.includes(x.id)){data.skin=x.id}else if(data.coins>=x.price){data.coins-=x.price;data.owned.push(x.id);data.skin=x.id}else return alert('No tienes suficientes monedas.');save();shop()});
document.querySelectorAll('[data-weapon]').forEach(b=>b.onclick=()=>{let x=weapons.find(a=>a.id===b.dataset.weapon);if(data.weapon===x.id)return;if(data.weaponOwned?.includes(x.id)){data.weapon=x.id}else if(x.price===0){data.weapon=x.id}else if(data.coins>=x.price){data.coins-=x.price;data.weaponOwned=[...(data.weaponOwned||[]),x.id];data.weapon=x.id}else return alert('No tienes suficientes monedas.');save();shop()})}
function inventory(){let sk=skins.filter(x=>data.owned.includes(x.id));let we=[weapons[0],...weapons.filter(x=>(data.weaponOwned||[]).includes(x.id))];panel(`${head('INVENTARIO')}<div class="section">SKINS DESBLOQUEADAS</div><div class="grid">${sk.map(x=>`<div class="tile"><b>${x.name}</b><small>${data.skin===x.id?'Equipado':'Disponible'}</small><button data-eqskin="${x.id}">Equipar</button></div>`).join('')}</div><div class="section">ARMAS DESBLOQUEADAS</div><div class="grid">${we.map(x=>`<div class="tile"><b>${x.name}</b><small>${data.weapon===x.id?'Equipada':'Disponible'}</small><button data-eqweap="${x.id}">Equipar</button></div>`).join('')}</div><button class="alt" id="back">VOLVER</button>`);$('back').onclick=back;document.querySelectorAll('[data-eqskin]').forEach(b=>b.onclick=()=>{data.skin=b.dataset.eqskin;save();inventory()});document.querySelectorAll('[data-eqweap]').forEach(b=>b.onclick=()=>{data.weapon=b.dataset.eqweap;save();inventory()})}
function missions(){let m=data.missions||{kills:0,waves:0};panel(`${head('MISIONES Y RECOMPENSAS')}<div class="tile"><b>Elimina 20 enemigos</b><small>${Math.min(20,m.kills||0)}/20</small><p class="coin">Premio: 80 monedas</p><button id="claimK" ${m.kills>=20?'':'disabled'}>${m.claimK?'RECLAMADA':'Reclamar'}</button></div><div class="tile" style="margin-top:8px"><b>Alcanza 5 oleadas</b><small>${Math.min(5,m.waves||0)}/5</small><p class="coin">Premio: 100 monedas</p><button id="claimW" ${m.waves>=5?'':'disabled'}>${m.claimW?'RECLAMADA':'Reclamar'}</button></div><button class="alt" id="back">VOLVER</button>`);$('back').onclick=back;$('claimK').onclick=()=>claim('kills',80);$('claimW').onclick=()=>claim('waves',100)}
function claim(k,n){data.missions=data.missions||{};let flag=k==='kills'?'claimK':'claimW';if(!data.missions[flag]&&(data.missions[k]||0)>=(k==='kills'?20:5)){data.missions[flag]=true;data.coins+=n;save()}missions()}
function profile(){panel(`${head('PERFIL DE JUGADOR')}<p class="muted">Cambia tu nombre de jugador.</p><input id="playerName" maxlength="20" value="${esc(data.name)}"><button id="saveName">GUARDAR PERFIL</button><div class="tile"><b>Estadísticas</b><small>Récord: ${data.high}<br>Eliminaciones: ${data.kills}<br>Monedas: ${data.coins}</small></div><button class="alt" id="back">VOLVER</button>`);$('back').onclick=back;$('saveName').onclick=()=>{data.name=$('playerName').value.trim()||'Jugador LEZ';save();profile()}}
function settings(){panel(`${head('AJUSTES')}<div class="tile"><b>Sonido</b><small>Control de efectos de sonido (preparado para audio)</small><button id="sound">${data.sound?'🔊 ACTIVADO':'🔇 DESACTIVADO'}</button></div><button class="alt" id="reset">BORRAR PROGRESO LOCAL</button><button class="alt" id="back">VOLVER</button>`);$('back').onclick=back;$('sound').onclick=()=>{data.sound=!data.sound;save();settings()};$('reset').onclick=()=>{if(confirm('¿Borrar monedas, compras y récord de este dispositivo?')){data={...defaults};save();settings()}}}
let socket=null, onlineRoom=null, onlineRole='host', remotePlayers={}, onlineReady=false;
function connectSocket(){
 if(socket && socket.connected) return;
 if(typeof io==='undefined'){alert('No se pudo cargar el cliente online. Abre esta versión desde el servidor publicado.');return}
 socket=io();
 socket.on('connect',()=>{onlineReady=true});
 socket.on('connect_error',()=>{onlineReady=false});
 socket.on('room-created',d=>{onlineRoom=d.code;onlineRole='host';showRoom(d)});
 socket.on('room-joined',d=>{onlineRoom=d.code;onlineRole='guest';showRoom(d)});
 socket.on('room-update',d=>{if(d.players)remotePlayers=d.players});
 socket.on('player-state',d=>{remotePlayers[d.id]=d.player});
 socket.on('player-left',d=>{delete remotePlayers[d.id]});
 socket.on('room-error',d=>alert(d.message||'No se pudo entrar a la sala.'));
 socket.on('game-started',()=>{alert('¡La sala inició! Esta versión sincroniza la sala y los jugadores; la sincronización completa de enemigos y disparos requiere ampliar el motor de juego.')});
}
function onlineInfo(){connectSocket();panel(`${head('MULTIJUGADOR ONLINE')}<div class="tile"><b>Crear una sala</b><small>Abre una sala privada y comparte el código con tu amigo.</small><button id="createRoom">＋ CREAR SALA</button></div><div class="tile" style="margin-top:9px"><b>Unirse a una sala</b><input id="roomCode" maxlength="5" placeholder="CÓDIGO DE SALA"><button id="joinRoom">ENTRAR A SALA</button></div><p class="muted">Ambos jugadores deben abrir LEZ desde la misma dirección web publicada.</p><button class="alt" id="back">VOLVER</button>`);$('back').onclick=back;$('createRoom').onclick=()=>{connectSocket();if(!socket)return;socket.emit('create-room',{name:data.name})};$('joinRoom').onclick=()=>{connectSocket();let code=$('roomCode').value.trim().toUpperCase();if(code.length!==5)return alert('Escribe un código de 5 caracteres.');socket.emit('join-room',{code,name:data.name})}}
function showRoom(d){panel(`${head('SALA ONLINE')}<div class="tile"><b>CÓDIGO: <span style="color:#f0abfc;font-size:25px">${esc(d.code)}</span></b><small>Comparte este código con tu amigo.</small><button id="copyCode" class="alt">COPIAR CÓDIGO</button></div><p class="muted">Jugadores: ${d.count||1}/2</p><button id="startOnline">INICIAR PARTIDA</button><button class="alt" id="leaveRoom">SALIR DE LA SALA</button>`);$('copyCode').onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(d.code);else alert('Código de sala: '+d.code)};$('startOnline').onclick=()=>{if(socket)socket.emit('start-game',{code:onlineRoom})};$('leaveRoom').onclick=()=>{if(socket)socket.emit('leave-room');onlineRoom=null;remotePlayers={};onlineInfo()}}
function makePlayer(x,y,color,id){return{x,y,r:14,hp:100,color,id,speed:220,cool:0,dash:0,dx:0,dy:0}}
function start(n){mode=n;let skin=skins.find(s=>s.id===data.skin)||skins[0];players=[makePlayer(W*.42,H*.52,skin.color,1)];if(n===2)players.push(makePlayer(W*.58,H*.52,'#5eead4',2));enemies=[];bullets=[];particles=[];score=0;wave=1;spawn=0;active=true;paused=false;$('overlay').classList.add('hidden');$('controls').classList.remove('hidden');$('hud').classList.remove('hidden');$('pause').classList.remove('hidden');last=performance.now();requestAnimationFrame(loop)}
function pauseGame(){if(!active)return;paused=!paused;if(paused){$('overlay').classList.remove('hidden');panel(`${head('PARTIDA EN PAUSA')}<h3>⭐ ${score} puntos</h3><button id="resume">▶ CONTINUAR</button><button class="alt" id="restart">↻ REINICIAR</button><button class="alt" id="exit">⌂ SALIR AL MENÚ</button>`);$('resume').onclick=()=>{paused=false;$('overlay').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)};$('restart').onclick=()=>start(mode);$('exit').onclick=menu}else{$('overlay').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}}
$('pause').onclick=pauseGame;
$('stick').addEventListener('pointerdown',e=>{joy.on=true;$('stick').setPointerCapture(e.pointerId);moveJoy(e)});$('stick').addEventListener('pointermove',e=>{if(joy.on)moveJoy(e)});function moveJoy(e){let r=$('stick').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),m=35;if(l>m){x=x/l*m;y=y/l*m}joy.x=x/m;joy.y=y/m;$('knob').style.transform=`translate(${x}px,${y}px)`}
function joyEnd(){joy.on=false;joy.x=joy.y=0;$('knob').style.transform='translate(0,0)'}$('stick').addEventListener('pointerup',joyEnd);$('stick').addEventListener('pointercancel',joyEnd);
$('fire').addEventListener('pointerdown',e=>{firing=true;$('fire').setPointerCapture(e.pointerId)});$('fire').addEventListener('pointerup',()=>firing=false);$('fire').addEventListener('pointercancel',()=>firing=false);$('dash').addEventListener('pointerdown',()=>{if(players[0])players[0].dash=.22});
function nearest(p){let best=null,d=1e9;for(let e of enemies){let q=Math.hypot(e.x-p.x,e.y-p.y);if(q<d){d=q;best=e}}return best}
function shoot(p){let t=nearest(p),a=t?Math.atan2(t.y-p.y,t.x-p.x):Math.atan2(p.dy||-1,p.dx||0),w=weapons.find(x=>x.id===data.weapon)||weapons[0];bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:5,life:1.2,damage:w.damage})}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*140;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.3,color})}}
let netTick=0;
function update(dt){spawn-=dt;
if(onlineRoom && socket && socket.connected){netTick+=dt;if(netTick>.08){netTick=0;let p=players[0];if(p)socket.emit('player-state',{code:onlineRoom,player:{x:p.x,y:p.y,hp:p.hp,color:p.color,name:data.name}})}}if(spawn<=0){for(let i=0;i<Math.min(3+wave,12);i++){let a=Math.random()*Math.PI*2,r=Math.max(W,H)*.62;enemies.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,r:11+Math.random()*5,hp:wave>3?2:1,speed:48+Math.random()*24+wave*3})}spawn=Math.max(.7,3.8-wave*.18)}
for(let i=0;i<players.length;i++){let p=players[i];if(p.hp<=0)continue;let x=0,y=0;if(i===0){x=joy.x;y=joy.y;if(keys.a)x--;if(keys.d)x++;if(keys.w)y--;if(keys.s)y++;if(!joy.on){if(keys.arrowleft)x-=1;if(keys.arrowright)x++;if(keys.arrowup)y--;if(keys.arrowdown)y++}}else{x=(keys.arrowright?1:0)-(keys.arrowleft?1:0);y=(keys.arrowdown?1:0)-(keys.arrowup?1:0)}let l=Math.hypot(x,y)||1;x/=l;y/=l;p.dx=x;p.dy=y;let sp=p.speed*(p.dash>0?2.8:1);p.x=Math.max(p.r,Math.min(W-p.r,p.x+x*sp*dt));p.y=Math.max(p.r,Math.min(H-p.r,p.y+y*sp*dt));p.dash=Math.max(0,p.dash-dt);p.cool-=dt;let wants=i===0?(firing||keys[' ']):keys.enter;let weapon=weapons.find(a=>a.id===data.weapon)||weapons[0];if(wants&&p.cool<=0&&enemies.length){shoot(p);p.cool=weapon.rate}}
for(let e of enemies){let target=players.filter(p=>p.hp>0).sort((a,b)=>Math.hypot(e.x-a.x,e.y-a.y)-Math.hypot(e.x-b.x,e.y-b.y))[0];if(target){let a=Math.atan2(target.y-e.y,target.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(Math.hypot(e.x-target.x,e.y-target.y)<e.r+target.r){target.hp-=18*dt;shake=3}}}
for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of enemies){if(e.hp>0&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){e.hp-=b.damage;b.life=0;if(e.hp<=0){score+=10;data.kills++;data.missions=data.missions||{};data.missions.kills=(data.missions.kills||0)+1;burst(e.x,e.y,'#c084fc',7)}break}}}
bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);enemies=enemies.filter(e=>e.hp>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
let newWave=Math.floor(score/100)+1;if(newWave>wave){wave=newWave;data.missions=data.missions||{};data.missions.waves=Math.max(data.missions.waves||0,wave-1)}
$('health').textContent='❤️ '+Math.max(0,Math.round(players[0].hp))+(mode===2?' | 💚 '+Math.max(0,Math.round(players[1].hp)):'');$('wave').textContent='OLEADA '+wave;$('score').textContent='⭐ '+score;$('coins').textContent='🪙 '+data.coins;if(players.every(p=>p.hp<=0))endGame()}
function draw(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85}ctx.fillStyle='#0b0814';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#241334';for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()}ctx.globalAlpha=1;for(let b of bullets){ctx.shadowBlur=14;ctx.shadowColor='#f0abfc';ctx.fillStyle='#f5d0fe';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}ctx.shadowBlur=0;for(let e of enemies){ctx.shadowBlur=18;ctx.shadowColor='#ef4444';ctx.fillStyle='#991b1b';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#fecaca';ctx.beginPath();ctx.arc(e.x-4,e.y-3,2,0,7);ctx.arc(e.x+4,e.y-3,2,0,7);ctx.fill()}ctx.shadowBlur=0;if(onlineRoom){for(const [id,rp] of Object.entries(remotePlayers)){if(!rp)continue;ctx.globalAlpha=.75;ctx.fillStyle='#5eead4';ctx.shadowBlur=18;ctx.shadowColor='#5eead4';ctx.beginPath();ctx.arc(rp.x,rp.y,14,0,7);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('ONLINE',rp.x,rp.y-23)}}
for(let p of players){if(p.hp<=0)continue;ctx.shadowBlur=22;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#160d22';ctx.beginPath();ctx.arc(p.x+4,p.y-3,4,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('P'+p.id,p.x,p.y-23)}ctx.restore()}
function loop(now){if(!active||paused)return;let dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw();if(active&&!paused)requestAnimationFrame(loop)}
function endGame(){active=false;let reward=Math.floor(score/10);data.coins+=reward;data.high=Math.max(data.high,score);save();$('controls').classList.add('hidden');$('hud').classList.add('hidden');$('pause').classList.add('hidden');$('overlay').classList.remove('hidden');panel(`${head('FIN DE LA PARTIDA')}<h2>⭐ ${score} PUNTOS</h2><p class="muted">Llegaste a la oleada ${wave}.</p><p class="coin">+${reward} monedas ganadas 🪙</p><button id="again">VOLVER A JUGAR</button><button class="alt" id="home">MENÚ PRINCIPAL</button>`);$('again').onclick=()=>start(mode);$('home').onclick=menu}
renderHome();
})();
</script></body></html>
